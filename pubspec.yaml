name: flutter_voice_game_agency
description: A comprehensive Flutter app with voice chat rooms, multiplayer games, coins/rewards system, and agency management.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Voice Chat & Audio
  agora_rtc_engine: ^6.3.0
  agora_rtm_engine: ^1.5.0
  permission_handler: ^11.4.4
  record: ^5.1.0
  audio_session: ^0.1.16

  # Real-time Database & Backend
  firebase_core: ^2.24.0
  firebase_database: ^10.3.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0

  # State Management
  provider: ^6.1.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # UI & Navigation
  flutter_screenutil: ^5.9.0
  get: ^4.6.6
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Games & Animation
  flame: ^1.14.0
  flame_audio: ^2.3.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.1.0
  shared_preferences: ^2.2.2
  http: ^1.1.0
  dio: ^5.3.1
  socket_io_client: ^2.0.2

  # Payments & Coins
  in_app_purchase: ^3.1.5
  pay: ^2.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/animations/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
